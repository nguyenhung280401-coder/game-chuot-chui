<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Đập Chuột Chũi - Dự Giờ Siêu Phẩm</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Màn hình bắt đầu -->
    <div id="start-screen" class="start-screen">
      <div class="start-content">
        <div class="game-logo">🐹 ĐẬP CHUỘT CHŨI 🐹</div>
        <p class="game-subtitle">
          Thử Thách Trí Tuệ & Phản Xạ - Chào Mừng Tiết Dự Giờ
        </p>
        <button class="btn-start" onclick="startGame()">🎮 CHƠI NGAY 🎮</button>
      </div>
    </div>

    <div id="game-container" class="game-hidden">
      <!-- Nền phong cảnh được phủ kín phía trên -->
      <div class="field-background" id="field-bg">
        <!-- Mặt trời và ánh nắng -->
        <div class="sun">☀️</div>
        <div class="sun-ray"></div>

        <!-- Chim bay lượn trên trời -->
        <div class="birds">🕊️ 🕊️</div>

        <!-- Mây trôi -->
        <div class="cloud cloud-1">☁️</div>
        <div class="cloud cloud-2">☁️</div>
        <div class="cloud cloud-3">☁️</div>

        <!-- Nhà kho nông trại nhỏ phía trên bên trái -->
        <div class="farm-barn">
          <div class="barn-roof"></div>
          <div class="barn-body"></div>
          <div class="barn-door"></div>
        </div>

        <!-- Đồi núi, cây cổ thụ, đá, bụi cây -->
        <div class="mountain mountain-left"></div>
        <div class="mountain mountain-right"></div>
        <div class="giant-tree">
          <div class="tree-trunk"></div>
          <div class="tree-leaves"></div>
        </div>

        <div class="ground-texture"></div>
        <div class="stone stone-1"></div>
        <div class="stone stone-2"></div>
        <div class="stone stone-3"></div>
        <div class="bush bush-1"></div>
        <div class="bush bush-2"></div>
      </div>

      <!-- Banner thông báo vòng chơi & Điểm số trên cùng -->
      <div class="game-hud">
        <div class="stage-banner" id="stage-banner">
          Vòng 1: Chuột Nông Dân (0/6)
        </div>
        <div class="score-board">⭐ Điểm: <span id="score-val">0</span></div>
      </div>

      <!-- Lưới 6 cái lỗ kèm ụ đất -->
      <div class="holes-grid">
        <div class="hole-wrapper">
          <div class="mound"></div>
          <div class="hole"></div>
          <div class="mole" id="mole-0" onclick="hitMole(0)"></div>
        </div>
        <div class="hole-wrapper">
          <div class="mound"></div>
          <div class="hole"></div>
          <div class="mole" id="mole-1" onclick="hitMole(1)"></div>
        </div>
        <div class="hole-wrapper">
          <div class="mound"></div>
          <div class="hole"></div>
          <div class="mole" id="mole-2" onclick="hitMole(2)"></div>
        </div>
        <div class="hole-wrapper">
          <div class="mound"></div>
          <div class="hole"></div>
          <div class="mole" id="mole-3" onclick="hitMole(3)"></div>
        </div>
        <div class="hole-wrapper">
          <div class="mound"></div>
          <div class="hole"></div>
          <div class="mole" id="mole-4" onclick="hitMole(4)"></div>
        </div>
        <div class="hole-wrapper">
          <div class="mound"></div>
          <div class="hole"></div>
          <div class="mole" id="mole-5" onclick="hitMole(5)"></div>
        </div>
      </div>
    </div>

    <!-- Hiệu ứng tóe lửa khi đập -->
    <div id="hit-sparkle">💥</div>

    <!-- Con trỏ Búa đập -->
    <svg id="hammer" viewBox="0 0 100 100">
      <rect
        x="42"
        y="35"
        width="16"
        height="60"
        rx="5"
        fill="#8B4513"
        stroke="#3a1c04"
        stroke-width="2"
      />
      <rect
        x="15"
        y="15"
        width="70"
        height="30"
        rx="6"
        fill="#708090"
        stroke="#2F4F4F"
        stroke-width="3"
      />
      <rect
        x="10"
        y="20"
        width="80"
        height="20"
        rx="3"
        fill="#A9A9A9"
        opacity="0.5"
      />
    </svg>

    <!-- Bảng câu hỏi (Modal) -->
    <div class="modal-overlay" id="question-modal">
      <div class="wooden-board">
        <h2 id="question-text">Nội dung câu hỏi...</h2>
        <div class="options-container" id="options-container"></div>
        <div class="feedback-message" id="feedback-msg"></div>
      </div>
    </div>

    <!-- Bảng phá đảo game tri ân siêu to khổng lồ -->
    <div class="thank-you-container" id="thank-you-board">
      <div class="ropes">
        <div class="chain"></div>
        <div class="chain"></div>
      </div>
      <div class="thank-board">
        <div class="iron-hook hook-left"></div>
        <div class="iron-hook hook-right"></div>
        <div class="victory-badge">🎉 PHÁ ĐẢO GAME XUẤT SẮC 🎉</div>
        <h1>
          Em xin chân thành cảm ơn các thầy cô giáo<br />đã đến dự giờ lớp chúng
          em ạ!
        </h1>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
